name: ci

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No job needs to write: every job reads the repo and the public npm registry only.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0; version read from package.json "packageManager"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Every file:line citation in CONSENSUS_CHANGES.md must still point at the line it quotes.
      - run: node scripts/check-consensus-citations.mjs
      - run: pnpm -r --filter "./packages/*" build
      # after the build: the tests import the workspace packages, whose types are their built dist/*.d.ts
      - run: pnpm run typecheck   # src and tests, strict + noUncheckedIndexedAccess
      - run: node scripts/check-lockstep.mjs   # workspace:* + published pins and published dist equal this build (queries npm) + dist-freshness (needs built dist/)
      # Per-package conformance. The node-dependent suites (client/light) and the live oracle
      # skip cleanly when there is no CSD node (CI has none); the deterministic core
      # (codec/crypto/tx/vectors) + edge + the pure security checks run and gate every push.
      - run: pnpm -r --filter "./packages/*" test
      - run: pnpm exec tsx test/edge.test.ts
      - run: pnpm exec tsx test/security.test.ts
      - run: pnpm exec tsx test/published-dist.test.ts
      - run: pnpm exec tsx test/check-consumer-pins.test.ts
      - run: pnpm exec tsx test/ci-workflow.test.ts   # this file: read-only token, no stored credentials, SHA pins, the secret scan
      - run: pnpm exec tsx test/dep-pins.test.ts   # every dependency exact or workspace:*, equal to what the lockfile resolves
      - run: pnpm exec tsx test/oracle.test.ts   # skips if no node (exit 0)

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0  # gitleaks scans the full history
      # Release binary checked against gitleaks_8.18.4_checksums.txt from the gitleaks GitHub release.
      # --diff-merges=first-parent: the default log shows no diff for a merge, so a secret added in a conflict resolution is missed.
      - name: gitleaks (full history, blocking)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          echo "ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --no-banner --redact -c .gitleaks.toml --log-opts="--full-history --all --diff-merges=first-parent"

  conformance:
    # Cross-language byte-contract guard (JS ⇄ Python). The resolver, the record codec,
    # and SIWC each have a Python reference (conformance/*_ref.py); they MUST stay
    # byte-identical to the JS canonical impl or the chain forks across implementations.
    # This is the REAL lockstep guard; it runs as its OWN job so it is enforced
    # independently of the version-lockstep check (check-lockstep.mjs) in `test`, which
    # passes and gates releases (it is NOT intentionally red).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter "./packages/*" build
      # crosscheck (records/codec + C1 trailing-control-char parse gate) + crosscheck-regex
      # (direct regex-vs-regex differential over raw control chars) + crosscheck-resolve +
      # crosscheck-siwc + nprofile-crosslang (v1.9 parse/resolve/dormancy + constant PARITY) +
      # 1500-iter fuzz (now emits nprofile), each asserting JS == Python. See conformance/README.md.
      - run: pnpm test:crosslang
      # Citation check + audit self-tests + invariants + race harness. Invariant and money-safety findings
      # are report-only (printed, exit 0); a stale citation, a failed self-test or a JS/Python divergence fails.
      - run: pnpm run audit:all
